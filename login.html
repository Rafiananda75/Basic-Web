<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Riyx Apparel</title>
</head>

    <body>

<div class="auth-container">

    <input type="checkbox" id="toggle" />

    <div class="forms-wrapper">

        <form class="form login-form" action="index.html" method="GET">
            <h2>Login</h2>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p class="toggle-text">
                Belum punya akun?
                <label for="toggle">Register</label>
            </p>
            <p class="toggle-text-nosign">
                <label><a href="index.html">Masuk Tanpa Akun</a></label>
            </p>
        </form>

        <form class="form register-form">
            <h2>Register</h2>
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
            <p class="toggle-text">
                Sudah punya akun?
                <label for="toggle">Login</label>
            </p>
        </form>

    </div>
</div>



    </body>
</html>
